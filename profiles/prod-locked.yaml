version: v1
rules:
  # Production mode must never read root dotenv files.
  - id: prod-locked-deny-root-env-read
    action_type: fs.read
    resource: file://workspace/.env
    decision: DENY

  # Production mode must never read nested dotenv files.
  - id: prod-locked-deny-nested-env-read
    action_type: fs.read
    resource: file://workspace/**/.env
    decision: DENY

  # Production mode must never read dotenv variants.
  - id: prod-locked-deny-env-variant-read
    action_type: fs.read
    resource: file://workspace/**/.env.*
    decision: DENY

  # Production mode must never read private keys.
  - id: prod-locked-deny-private-key-read
    action_type: fs.read
    resource: file://workspace/**/*.key
    decision: DENY

  # Production mode must never read netrc machine credentials.
  - id: prod-locked-deny-netrc-read
    action_type: fs.read
    resource: file://workspace/**/.netrc
    decision: DENY

  # Production mode must never read SSH key material.
  - id: prod-locked-deny-ssh-dir-read
    action_type: fs.read
    resource: file://workspace/**/.ssh/**
    decision: DENY

  # Production mode must never read AWS credential files.
  - id: prod-locked-deny-aws-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.aws/credentials
    decision: DENY

  # Production mode must never read GCP credential directories.
  - id: prod-locked-deny-gcp-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.gcp/**
    decision: DENY

  # Production mode must never read kubeconfig files.
  - id: prod-locked-deny-kubeconfig-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig
    decision: DENY

  # Production mode must never read kubeconfig variants.
  - id: prod-locked-deny-kubeconfig-variant-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig.*
    decision: DENY

  # Production mode must never read Kubernetes credential directories.
  - id: prod-locked-deny-kube-dir-read
    action_type: fs.read
    resource: file://workspace/**/.kube/**
    decision: DENY

  # Production mode may read non-secret workspace content for inspection.
  - id: prod-locked-allow-workspace-read
    action_type: fs.read
    resource: file://workspace/**
    decision: ALLOW
    obligations:
      sandbox_mode: controlled

  # Production mode blocks direct file writes.
  - id: prod-locked-deny-workspace-write
    action_type: fs.write
    resource: file://workspace/**
    decision: DENY

  # Production mode blocks repository patches.
  - id: prod-locked-deny-workspace-patch
    action_type: repo.apply_patch
    resource: repo://local/workspace
    decision: DENY

  # Production mode blocks repository publishing.
  - id: prod-locked-deny-git-push
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["git", "push"]
        - ["git", "push", "**"]

  # Production mode blocks dependency mutations.
  - id: prod-locked-deny-package-installs
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["go", "get"]
        - ["go", "get", "**"]
        - ["go", "mod", "tidy"]
        - ["npm", "install"]
        - ["npm", "install", "**"]
        - ["npm", "ci"]
        - ["python", "-m", "pip", "install", "**"]
        - ["py", "-3", "-m", "pip", "install", "**"]

  # Production mode blocks direct infrastructure mutations.
  - id: prod-locked-deny-infra-mutations
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["terraform", "apply"]
        - ["terraform", "apply", "**"]
        - ["terraform", "destroy"]
        - ["terraform", "destroy", "**"]
        - ["kubectl", "apply"]
        - ["kubectl", "apply", "**"]
        - ["kubectl", "delete"]
        - ["kubectl", "delete", "**"]
        - ["helm", "upgrade"]
        - ["helm", "upgrade", "**"]
        - ["helm", "uninstall"]
        - ["helm", "uninstall", "**"]

  # Production mode allows read-only git inspection.
  - id: prod-locked-allow-git-readonly
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["git", "status"]
        - ["git", "status", "**"]
        - ["git", "diff"]
        - ["git", "diff", "**"]
        - ["git", "log"]
        - ["git", "log", "**"]
        - ["git", "show"]
        - ["git", "show", "**"]
        - ["git", "remote"]
        - ["git", "remote", "-v"]
        - ["git", "remote", "--verbose"]
        - ["git", "remote", "show", "**"]
        - ["git", "remote", "get-url", "**"]
        - ["git", "blame", "**"]
        - ["git", "rev-parse", "**"]
        - ["git", "describe", "**"]
        - ["git", "tag"]
        - ["git", "tag", "-l", "**"]
        - ["git", "tag", "--list", "**"]
        - ["git", "stash", "list"]
        - ["git", "shortlog", "**"]
        - ["git", "ls-files"]
        - ["git", "ls-files", "**"]
        - ["git", "reflog"]
        - ["git", "reflog", "show", "**"]
        - ["git", "cat-file", "**"]
        - ["git", "merge-base", "**"]
        - ["git", "worktree", "list"]
        - ["git", "config", "--get", "**"]
        - ["git", "config", "--list"]
        - ["git", "config", "-l"]
        - ["git", "count-objects", "**"]
        - ["git", "check-ignore", "**"]
        - ["git", "branch"]
        - ["git", "branch", "-a"]
        - ["git", "branch", "-r"]
        - ["git", "branch", "-v"]
        - ["git", "branch", "-vv"]
        - ["git", "branch", "-a", "-v"]
        - ["git", "branch", "--show-current"]
        - ["git", "branch", "--list", "**"]
    obligations:
      sandbox_mode: controlled

  # Production mode allows read-only Kubernetes inspection.
  - id: prod-locked-allow-kubernetes-readonly
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["kubectl", "get"]
        - ["kubectl", "get", "**"]
        - ["kubectl", "describe"]
        - ["kubectl", "describe", "**"]
        - ["kubectl", "logs"]
        - ["kubectl", "logs", "**"]
    obligations:
      sandbox_mode: controlled

  # Production mode allows read-only Terraform inspection.
  - id: prod-locked-allow-terraform-readonly
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["terraform", "plan"]
        - ["terraform", "plan", "**"]
        - ["terraform", "show"]
        - ["terraform", "show", "**"]
    obligations:
      sandbox_mode: controlled

  # Production mode allows safe local inspection commands.
  - id: prod-locked-allow-local-inspection
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["pwd"]
        - ["ls"]
        - ["ls", "**"]
        - ["dir"]
        - ["dir", "**"]
        - ["printenv"]
        - ["printenv", "**"]
        - ["env"]
        - ["du", "**"]
        - ["df", "**"]
        - ["uname", "**"]
        - ["id"]
        - ["whoami"]
        - ["date"]
        - ["date", "**"]
        - ["hostname"]
        - ["nproc"]
        - ["arch"]
        - ["basename", "**"]
        - ["dirname", "**"]
        - ["realpath", "**"]
        - ["readlink", "**"]
        - ["type", "**"]
        - ["command", "-v", "**"]
    obligations:
      sandbox_mode: controlled

  # Production mode allows a narrow break-glass rollout restart only after approval.
  - id: prod-locked-approve-breakglass-rollout-restart
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["kubectl", "rollout", "restart", "**"]
    obligations:
      approval_scope_class: action_type_resource
      breakglass: true
      reason: production rollout restarts require explicit human approval

  # Production mode blocks HTTP requests that carry authorization material.
  - id: prod-locked-deny-http-authorization-header
    action_type: net.http_request
    resource: url://**/**
    decision: DENY
    params_match:
      headers.Authorization:
        present: true

  # Production mode only permits read-only checks to the production status endpoint.
  - id: prod-locked-allow-http-status
    action_type: net.http_request
    resource: url://status.example.com/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # Production mode cannot check out arbitrary secrets by default.
  - id: prod-locked-deny-secret-checkout
    action_type: secrets.checkout
    resource: secret://**/**
    decision: DENY

  # Deny any command whose arguments name secret material (dotenv, keys, cloud and cluster credentials), wherever the token appears.
  - id: prod-locked-deny-exec-secret-file-args
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["**", "*.env", "**"]
        - ["**", "*.env.*", "**"]
        - ["**", "*.envrc", "**"]
        - ["**", "*.pem", "**"]
        - ["**", "*.key", "**"]
        - ["**", "*id_rsa*", "**"]
        - ["**", "*id_ed25519*", "**"]
        - ["**", "*id_ecdsa*", "**"]
        - ["**", "*.ssh/*", "**"]
        - ["**", "*.aws/*", "**"]
        - ["**", "*.gcp/*", "**"]
        - ["**", "*.kube/*", "**"]
        - ["**", "*kubeconfig*", "**"]
        - ["**", "*.netrc", "**"]

  # Deny deletes that target the home directory, the filesystem root, a drive root, or a parent directory, as a whole or through a literal glob (`\*` is a literal star). Other paths outside the workspace are left to the hook's boundary check, which asks.
  - id: prod-locked-deny-catastrophic-delete
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["rm", "**", "~", "**"]
        - ["rm", "**", "~/", "**"]
        - ['rm', '**', '~/\*', '**']
        - ["rm", "**", "/", "**"]
        - ['rm', '**', '/\*', '**']
        - ["rm", "**", "..", "**"]
        - ['rm', '**', '../\*', '**']
        - ["rm", "**", "?:", "**"]
        - ['rm', '**', '?:\', '**']
        - ["rm", "**", "?:/", "**"]
        - ["rm", "**", "/mnt/?", "**"]
        - ["rm", "**", "/mnt/?/", "**"]
        - ["rmdir", "**", "~", "**"]
        - ["rmdir", "**", "~/", "**"]
        - ['rmdir', '**', '~/\*', '**']
        - ["rmdir", "**", "/", "**"]
        - ['rmdir', '**', '/\*', '**']
        - ["rmdir", "**", "..", "**"]
        - ['rmdir', '**', '../\*', '**']
        - ["rmdir", "**", "?:", "**"]
        - ['rmdir', '**', '?:\', '**']
        - ["rmdir", "**", "?:/", "**"]
        - ["rmdir", "**", "/mnt/?", "**"]
        - ["rmdir", "**", "/mnt/?/", "**"]

  # Inline interpreter code (python -c, node -e, ruby -e, ...) and interactive interpreters or shells run
  # code the policy cannot see: they are denied. Scripts started by name are decided by the toolchain rules
  # above; flag clusters and glued forms (-Bc, -c'code') are a documented limit.
  - id: prod-locked-deny-inline-interpreter-code
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        # Inline code passed on the command line.
        - ["python*", "-c", "**"]
        - ["python*", "-*", "-c", "**"]
        - ["python*", "-*", "-*", "-c", "**"]
        - ["python*", "-W", "*", "-c", "**"]
        - ["python*", "-X", "*", "-c", "**"]
        - ["py", "-c", "**"]
        - ["py", "-*", "-c", "**"]
        - ["uv", "run", "python*", "-c", "**"]
        - ["uv", "run", "python*", "-*", "-c", "**"]
        - ["poetry", "run", "python*", "-c", "**"]
        - ["pipenv", "run", "python*", "-c", "**"]
        - ["node", "-e", "**"]
        - ["node", "--eval", "**"]
        - ["node", "--eval=*", "**"]
        - ["node", "-p", "**"]
        - ["node", "--print", "**"]
        - ["node", "--print=*", "**"]
        - ["node", "-*", "-e", "**"]
        - ["node", "-*", "--eval", "**"]
        - ["node", "-*", "--eval=*", "**"]
        - ["node", "-*", "-p", "**"]
        - ["node", "-*", "--print", "**"]
        - ["node", "-*", "--print=*", "**"]
        - ["bun", "-e", "**"]
        - ["bun", "--eval", "**"]
        - ["bun", "-p", "**"]
        - ["bun", "--print", "**"]
        - ["deno", "eval", "**"]
        - ["ruby", "-e", "**"]
        - ["ruby", "-*", "-e", "**"]
        - ["perl", "-e", "**"]
        - ["perl", "-E", "**"]
        - ["perl", "-*", "-e", "**"]
        - ["perl", "-*", "-E", "**"]
        - ["php", "-r", "**"]
        - ["php", "-*", "-r", "**"]
        # Interactive interpreters and shells, and programs read from stdin.
        - ["python*"]
        - ["python*", "-"]
        - ["python*", "-i", "**"]
        - ["py"]
        - ["node"]
        - ["node", "-"]
        - ["node", "-i"]
        - ["node", "--interactive"]
        - ["bun", "repl"]
        - ["deno"]
        - ["deno", "repl"]
        - ["ruby"]
        - ["ruby", "-"]
        - ["irb", "**"]
        - ["perl"]
        - ["perl", "-"]
        - ["php", "-a"]
        - ["bash"]
        - ["bash", "-"]
        - ["sh"]
        - ["sh", "-"]
        - ["zsh"]
        - ["dash"]
        - ["fish"]
        - ["ksh"]

  # Deny destructive git operations however their arguments are spelled.
  - id: prod-locked-deny-git-destructive-with-args
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["git", "reset", "--hard", "**"]
        - ["git", "clean", "**"]
        - ["git", "branch", "-D", "**"]
        - ["git", "push", "--force", "**"]
        - ["git", "push", "-f", "**"]
        - ["git", "push", "--force-with-lease", "**"]
        - ["git", "push", "--force*", "**"]
        - ["git", "push", "**", "--force*", "**"]
        - ["git", "push", "**", "-f", "**"]
        - ["git", "commit", "--amend"]
        - ["git", "commit", "--amend", "**"]
        - ["git", "commit", "**", "--amend", "**"]
        - ["git", "restore", "**"]
        - ["git", "checkout", "."]
        - ["git", "checkout", "**", "--", "**"]
