version: v1
rules:
  # Never expose root dotenv files to local agents.
  - id: safe-dev-deny-root-env-read
    action_type: fs.read
    resource: file://workspace/.env
    decision: DENY

  # Never expose nested dotenv files to local agents.
  - id: safe-dev-deny-nested-env-read
    action_type: fs.read
    resource: file://workspace/**/.env
    decision: DENY

  # Block common dotenv variants such as .env.local and .env.production.
  - id: safe-dev-deny-env-variant-read
    action_type: fs.read
    resource: file://workspace/**/.env.*
    decision: DENY

  # Block local shell environment hooks that often contain secrets.
  - id: safe-dev-deny-envrc-read
    action_type: fs.read
    resource: file://workspace/**/.envrc
    decision: DENY

  # Block private key files anywhere in the workspace.
  - id: safe-dev-deny-private-key-read
    action_type: fs.read
    resource: file://workspace/**/*.key
    decision: DENY

  # Block PEM credentials anywhere in the workspace.
  - id: safe-dev-deny-pem-read
    action_type: fs.read
    resource: file://workspace/**/*.pem
    decision: DENY

  # Block common cloud and cluster credential directories.
  - id: safe-dev-deny-credential-dirs-read
    action_type: fs.read
    resource: file://workspace/**/.kube/**
    decision: DENY

  # Block netrc machine credentials.
  - id: safe-dev-deny-netrc-read
    action_type: fs.read
    resource: file://workspace/**/.netrc
    decision: DENY

  # Block SSH key material in checked-out workspaces.
  - id: safe-dev-deny-ssh-dir-read
    action_type: fs.read
    resource: file://workspace/**/.ssh/**
    decision: DENY

  # Block AWS credential files in checked-out workspaces.
  - id: safe-dev-deny-aws-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.aws/credentials
    decision: DENY

  # Block GCP credential directories in checked-out workspaces.
  - id: safe-dev-deny-gcp-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.gcp/**
    decision: DENY

  # Block kubeconfig files in checked-out workspaces.
  - id: safe-dev-deny-kubeconfig-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig
    decision: DENY

  # Block kubeconfig variants in checked-out workspaces.
  - id: safe-dev-deny-kubeconfig-variant-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig.*
    decision: DENY

  # Allow non-secret workspace reads for normal coding tasks.
  - id: safe-dev-allow-workspace-read
    action_type: fs.read
    resource: file://workspace/**
    decision: ALLOW

  # Allow local workspace writes; path controls remain enforced by the executor.
  - id: safe-dev-allow-workspace-write
    action_type: fs.write
    resource: file://workspace/**
    decision: ALLOW
    obligations:
      sandbox_mode: local

  # Allow deterministic patch application inside the checked-out workspace.
  - id: safe-dev-allow-workspace-patch
    action_type: repo.apply_patch
    resource: repo://local/workspace
    decision: ALLOW
    obligations:
      sandbox_mode: local

  # Require human review before publishing repository state.
  - id: safe-dev-approve-git-push
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["git", "push"]
        - ["git", "push", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: publishing repository changes requires human confirmation

  # Require human review before history-rewriting git operations.
  - id: safe-dev-approve-git-history-rewrite
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["git", "reset", "--hard"]
        - ["git", "rebase"]
        - ["git", "rebase", "**"]
        - ["git", "checkout", "--"]
        - ["git", "checkout", "--", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: destructive git operations require human confirmation

  # Require approval before infrastructure mutations.
  - id: safe-dev-approve-infra-mutations
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["terraform", "apply"]
        - ["terraform", "apply", "**"]
        - ["terraform", "destroy"]
        - ["terraform", "destroy", "**"]
        - ["kubectl", "apply"]
        - ["kubectl", "apply", "**"]
        - ["kubectl", "delete"]
        - ["kubectl", "delete", "**"]
        - ["helm", "upgrade"]
        - ["helm", "upgrade", "**"]
        - ["helm", "uninstall"]
        - ["helm", "uninstall", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: infrastructure mutations require human confirmation

  # Require approval for database mutation clients.
  - id: safe-dev-approve-db-mutations
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["psql", "**"]
        - ["mysql", "**"]
        - ["mongosh", "**"]
        - ["redis-cli", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: database clients may mutate production-like data

  # Allow common read-only git inspection.
  - id: safe-dev-allow-git-readonly
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["git", "status"]
        - ["git", "status", "**"]
        - ["git", "diff"]
        - ["git", "diff", "**"]
        - ["git", "log"]
        - ["git", "log", "**"]
        - ["git", "show"]
        - ["git", "show", "**"]
        - ["git", "branch"]
        - ["git", "branch", "**"]
        - ["git", "remote"]
        - ["git", "remote", "-v"]
        - ["git", "remote", "--verbose"]
        - ["git", "remote", "show", "**"]
        - ["git", "remote", "get-url", "**"]
        - ["git", "blame", "**"]
        - ["git", "rev-parse", "**"]
        - ["git", "describe", "**"]
        - ["git", "tag"]
        - ["git", "tag", "-l", "**"]
        - ["git", "tag", "--list", "**"]
        - ["git", "stash", "list"]
        - ["git", "shortlog", "**"]
        - ["git", "ls-files"]
        - ["git", "ls-files", "**"]
        - ["git", "reflog"]
        - ["git", "reflog", "show", "**"]
        - ["git", "cat-file", "**"]
        - ["git", "merge-base", "**"]
        - ["git", "worktree", "list"]
        - ["git", "config", "--get", "**"]
        - ["git", "config", "--list"]
        - ["git", "config", "-l"]
        - ["git", "count-objects", "**"]
        - ["git", "check-ignore", "**"]
    obligations:
      sandbox_mode: local

  # Allow local test and build loops.
  - id: safe-dev-allow-build-test
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["go", "test"]
        - ["go", "test", "**"]
        - ["go", "build"]
        - ["go", "build", "**"]
        - ["go", "vet"]
        - ["go", "vet", "**"]
        - ["npm", "test"]
        - ["npm", "test", "**"]
        - ["npm", "run", "**"]
        - ["python", "-m", "pytest"]
        - ["python", "-m", "pytest", "**"]
        - ["py", "-3", "-m", "pytest"]
        - ["py", "-3", "-m", "pytest", "**"]
    obligations:
      sandbox_mode: local

  # Allow dependency installation in the developer profile.
  - id: safe-dev-allow-package-installs
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["go", "mod", "download"]
        - ["go", "mod", "download", "**"]
        - ["go", "mod", "tidy"]
        - ["npm", "install"]
        - ["npm", "install", "**"]
        - ["npm", "ci"]
        - ["python", "-m", "pip", "install", "**"]
        - ["py", "-3", "-m", "pip", "install", "**"]
    obligations:
      sandbox_mode: local

  # Allow safe local inspection commands.
  - id: safe-dev-allow-local-inspection
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["pwd"]
        - ["ls"]
        - ["ls", "**"]
        - ["dir"]
        - ["dir", "**"]
        - ["go", "version"]
        - ["node", "--version"]
        - ["python", "--version"]
        - ["py", "--version"]
        - ["printenv"]
        - ["printenv", "**"]
        - ["env"]
        - ["du", "**"]
        - ["df", "**"]
        - ["uname", "**"]
        - ["id"]
        - ["whoami"]
        - ["date"]
        - ["date", "**"]
        - ["hostname"]
        - ["nproc"]
        - ["arch"]
        - ["basename", "**"]
        - ["dirname", "**"]
        - ["realpath", "**"]
        - ["readlink", "**"]
        - ["type", "**"]
        - ["command", "-v", "**"]
    obligations:
      sandbox_mode: local

  # Prevent outbound requests that include bearer or basic auth material.
  - id: safe-dev-deny-http-authorization-header
    action_type: net.http_request
    resource: url://**/**
    decision: DENY
    params_match:
      headers.Authorization:
        present: true

  # Prevent outbound requests that include lowercase authorization headers.
  - id: safe-dev-deny-http-lowercase-authorization-header
    action_type: net.http_request
    resource: url://**/**
    decision: DENY
    params_match:
      headers.authorization:
        present: true

  # Prevent cookie-bearing HTTP requests from leaking session material.
  - id: safe-dev-deny-http-cookie-header
    action_type: net.http_request
    resource: url://**/**
    decision: DENY
    params_match:
      headers.Cookie:
        present: true

  # Allow read-only requests to common source and package hosts.
  - id: safe-dev-allow-http-get-allowlist
    action_type: net.http_request
    resource: url://github.com/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # Allow read-only requests to Go module mirrors.
  - id: safe-dev-allow-http-go-proxy
    action_type: net.http_request
    resource: url://proxy.golang.org/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # Allow read-only requests to npm registry metadata.
  - id: safe-dev-allow-http-npm-registry
    action_type: net.http_request
    resource: url://registry.npmjs.org/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # Allow read-only requests to Python package indexes.
  - id: safe-dev-allow-http-python-packages
    action_type: net.http_request
    resource: url://pypi.org/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # Forbid direct secret checkout by default.
  - id: safe-dev-deny-secret-checkout
    action_type: secrets.checkout
    resource: secret://**/**
    decision: DENY

  # Deny any command whose arguments name secret material (dotenv, keys, cloud and cluster credentials), wherever the token appears.
  - id: safe-dev-deny-exec-secret-file-args
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["**", "*.env", "**"]
        - ["**", "*.env.*", "**"]
        - ["**", "*.envrc", "**"]
        - ["**", "*.pem", "**"]
        - ["**", "*.key", "**"]
        - ["**", "*id_rsa*", "**"]
        - ["**", "*id_ed25519*", "**"]
        - ["**", "*id_ecdsa*", "**"]
        - ["**", "*.ssh/*", "**"]
        - ["**", "*.aws/*", "**"]
        - ["**", "*.gcp/*", "**"]
        - ["**", "*.kube/*", "**"]
        - ["**", "*kubeconfig*", "**"]
        - ["**", "*.netrc", "**"]

  # Deny deletes that target the home directory, the filesystem root, a drive root, or a parent directory, as a whole or through a literal glob (`\*` is a literal star). Other paths outside the workspace are left to the hook's boundary check, which asks.
  - id: safe-dev-deny-catastrophic-delete
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["rm", "**", "~", "**"]
        - ["rm", "**", "~/", "**"]
        - ['rm', '**', '~/\*', '**']
        - ["rm", "**", "/", "**"]
        - ['rm', '**', '/\*', '**']
        - ["rm", "**", "..", "**"]
        - ['rm', '**', '../\*', '**']
        - ["rm", "**", "?:", "**"]
        - ['rm', '**', '?:\', '**']
        - ["rm", "**", "?:/", "**"]
        - ["rm", "**", "/mnt/?", "**"]
        - ["rm", "**", "/mnt/?/", "**"]
        - ["rmdir", "**", "~", "**"]
        - ["rmdir", "**", "~/", "**"]
        - ['rmdir', '**', '~/\*', '**']
        - ["rmdir", "**", "/", "**"]
        - ['rmdir', '**', '/\*', '**']
        - ["rmdir", "**", "..", "**"]
        - ['rmdir', '**', '../\*', '**']
        - ["rmdir", "**", "?:", "**"]
        - ['rmdir', '**', '?:\', '**']
        - ["rmdir", "**", "?:/", "**"]
        - ["rmdir", "**", "/mnt/?", "**"]
        - ["rmdir", "**", "/mnt/?/", "**"]

  # Allow common read-only inspection tools so they do not prompt; secret-file arguments are still denied above (deny wins).
  - id: safe-dev-allow-readonly-file-tools
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["cat", "**"]
        - ["head", "**"]
        - ["tail", "**"]
        - ["wc", "**"]
        - ["grep", "**"]
        - ["rg", "**"]
        - ["find", "**"]
        - ["echo", "**"]
        - ["which", "**"]
        - ["stat", "**"]
        - ["tree", "**"]
        - ["sort", "**"]
        - ["uniq", "**"]
        - ["cut", "**"]
        - ["diff", "**"]
        - ["file", "**"]
    obligations:
      sandbox_mode: local

  # Require human review for destructive git operations however their arguments are spelled (see also safe-dev-approve-git-history-rewrite).
  - id: safe-dev-approve-git-destructive-with-args
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["git", "reset", "--hard", "**"]
        - ["git", "clean", "**"]
        - ["git", "branch", "-D", "**"]
        - ["git", "push", "--force", "**"]
        - ["git", "push", "-f", "**"]
        - ["git", "push", "--force-with-lease", "**"]
        - ["git", "push", "--force*", "**"]
        - ["git", "push", "**", "--force*", "**"]
        - ["git", "push", "**", "-f", "**"]
        - ["git", "commit", "--amend"]
        - ["git", "commit", "--amend", "**"]
        - ["git", "commit", "**", "--amend", "**"]
        - ["git", "restore", "**"]
        - ["git", "checkout", "."]
        - ["git", "checkout", "**", "--", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: destructive git operations require human confirmation

  # Everyday git workflow inside the workspace. Destructive forms (history rewrite, force push, discarding changes) are caught above by the REQUIRE_APPROVAL rules, which win over this allow.
  - id: safe-dev-allow-git-workflow
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["git", "add", "**"]
        - ["git", "commit", "**"]
        - ["git", "checkout", "**"]
        - ["git", "switch", "**"]
        - ["git", "fetch"]
        - ["git", "fetch", "**"]
        - ["git", "pull"]
        - ["git", "pull", "**"]
        - ["git", "merge", "**"]
        - ["git", "stash"]
        - ["git", "stash", "**"]
        - ["git", "tag", "**"]
        - ["git", "rm", "**"]
        - ["git", "mv", "**"]
        - ["git", "init"]
        - ["git", "init", "**"]
        - ["git", "submodule", "**"]
        - ["git", "cherry-pick", "**"]
    obligations:
      sandbox_mode: local

  # The project's own toolchain: build, test, lint, format, and package managers. Allowing a tool that runs project code allows that code; this is the developer's own environment.
  - id: safe-dev-allow-dev-toolchain
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["go", "**"]
        - ["gofmt", "**"]
        - ["goimports", "**"]
        - ["golangci-lint", "**"]
        - ["staticcheck", "**"]
        - ["cargo", "**"]
        - ["rustc", "**"]
        - ["rustup", "**"]
        - ["rustfmt", "**"]
        - ["node", "**"]
        - ["npm", "**"]
        - ["npx", "**"]
        - ["yarn", "**"]
        - ["pnpm", "**"]
        - ["bun", "**"]
        - ["deno", "**"]
        - ["tsc", "**"]
        - ["eslint", "**"]
        - ["prettier", "**"]
        - ["jest", "**"]
        - ["vitest", "**"]
        - ["python", "**"]
        - ["python3", "**"]
        - ["py", "**"]
        - ["pip", "**"]
        - ["pip3", "**"]
        - ["uv", "**"]
        - ["uvx", "**"]
        - ["poetry", "**"]
        - ["pipx", "**"]
        - ["pytest", "**"]
        - ["tox", "**"]
        - ["ruff", "**"]
        - ["black", "**"]
        - ["isort", "**"]
        - ["mypy", "**"]
        - ["flake8", "**"]
        - ["make"]
        - ["make", "**"]
        - ["cmake", "**"]
        - ["ninja", "**"]
        - ["gradle", "**"]
        - ["gradlew", "**"]
        - ["mvn", "**"]
        - ["dotnet", "**"]
        - ["java", "**"]
        - ["javac", "**"]
        - ["ruby", "**"]
        - ["bundle", "**"]
        - ["gem", "**"]
        - ["php", "**"]
        - ["composer", "**"]
        - ["shellcheck", "**"]
        - ["yamllint", "**"]
        - ["markdownlint", "**"]
    obligations:
      sandbox_mode: local

  # Workspace file operations. The hook checks every path against the workspace boundary and asks for anything outside it; secret-file arguments are still denied above.
  - id: safe-dev-allow-workspace-file-ops
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["mkdir", "**"]
        - ["touch", "**"]
        - ["cp", "**"]
        - ["mv", "**"]
        - ["ln", "**"]
        - ["chmod", "**"]
        - ["tar", "**"]
        - ["zip", "**"]
        - ["unzip", "**"]
        - ["gzip", "**"]
        - ["gunzip", "**"]
        - ["xz", "**"]
        - ["sed", "**"]
        - ["awk", "**"]
        - ["jq", "**"]
        - ["yq", "**"]
        - ["tee", "**"]
        - ["tr", "**"]
        - ["base64", "**"]
        - ["sha256sum", "**"]
        - ["shasum", "**"]
        - ["md5sum", "**"]
        - ["true"]
        - ["false"]
        - ["sleep", "**"]
        - ["test", "**"]
        - ["[", "**"]
    obligations:
      sandbox_mode: local

  # Deleting files asks for confirmation (the catastrophic targets above are denied outright).
  - id: safe-dev-approve-delete
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        - ["rm", "**"]
        - ["rmdir", "**"]
    obligations:
      approval_scope_class: action_type_resource
      reason: deleting files requires human confirmation

  # Inline interpreter code (python -c, node -e, ruby -e, ...) and interactive interpreters or shells run
  # code the policy cannot see: they ask for confirmation. Scripts started by name are decided by the toolchain rules
  # above; flag clusters and glued forms (-Bc, -c'code') are a documented limit.
  - id: safe-dev-approve-inline-interpreter-code
    action_type: process.exec
    resource: file://workspace/
    decision: REQUIRE_APPROVAL
    exec_match:
      argv_patterns:
        # Inline code passed on the command line.
        - ["python*", "-c", "**"]
        - ["python*", "-*", "-c", "**"]
        - ["python*", "-*", "-*", "-c", "**"]
        - ["python*", "-W", "*", "-c", "**"]
        - ["python*", "-X", "*", "-c", "**"]
        - ["py", "-c", "**"]
        - ["py", "-*", "-c", "**"]
        - ["uv", "run", "python*", "-c", "**"]
        - ["uv", "run", "python*", "-*", "-c", "**"]
        - ["poetry", "run", "python*", "-c", "**"]
        - ["pipenv", "run", "python*", "-c", "**"]
        - ["node", "-e", "**"]
        - ["node", "--eval", "**"]
        - ["node", "--eval=*", "**"]
        - ["node", "-p", "**"]
        - ["node", "--print", "**"]
        - ["node", "--print=*", "**"]
        - ["node", "-*", "-e", "**"]
        - ["node", "-*", "--eval", "**"]
        - ["node", "-*", "--eval=*", "**"]
        - ["node", "-*", "-p", "**"]
        - ["node", "-*", "--print", "**"]
        - ["node", "-*", "--print=*", "**"]
        - ["bun", "-e", "**"]
        - ["bun", "--eval", "**"]
        - ["bun", "-p", "**"]
        - ["bun", "--print", "**"]
        - ["deno", "eval", "**"]
        - ["ruby", "-e", "**"]
        - ["ruby", "-*", "-e", "**"]
        - ["perl", "-e", "**"]
        - ["perl", "-E", "**"]
        - ["perl", "-*", "-e", "**"]
        - ["perl", "-*", "-E", "**"]
        - ["php", "-r", "**"]
        - ["php", "-*", "-r", "**"]
        # Interactive interpreters and shells, and programs read from stdin.
        - ["python*"]
        - ["python*", "-"]
        - ["python*", "-i", "**"]
        - ["py"]
        - ["node"]
        - ["node", "-"]
        - ["node", "-i"]
        - ["node", "--interactive"]
        - ["bun", "repl"]
        - ["deno"]
        - ["deno", "repl"]
        - ["ruby"]
        - ["ruby", "-"]
        - ["irb", "**"]
        - ["perl"]
        - ["perl", "-"]
        - ["php", "-a"]
        - ["bash"]
        - ["bash", "-"]
        - ["sh"]
        - ["sh", "-"]
        - ["zsh"]
        - ["dash"]
        - ["fish"]
        - ["ksh"]
    obligations:
      approval_scope_class: action_type_resource
      reason: inline interpreter code and interactive interpreters require human confirmation

  # Writing to secret material asks for confirmation; reading it stays denied above.
  - id: safe-dev-approve-secret-file-write
    action_type: fs.write
    resource: file://workspace/**/.env
    decision: REQUIRE_APPROVAL
    obligations:
      reason: writing a secrets file requires human confirmation
  - id: safe-dev-approve-secret-file-variant-write
    action_type: fs.write
    resource: file://workspace/**/.env.*
    decision: REQUIRE_APPROVAL
  - id: safe-dev-approve-root-secret-file-write
    action_type: fs.write
    resource: file://workspace/.env
    decision: REQUIRE_APPROVAL
  - id: safe-dev-approve-key-file-write
    action_type: fs.write
    resource: file://workspace/**/*.key
    decision: REQUIRE_APPROVAL
  - id: safe-dev-approve-pem-file-write
    action_type: fs.write
    resource: file://workspace/**/*.pem
