version: v1
rules:
  # CI must never read root dotenv files.
  - id: ci-strict-deny-root-env-read
    action_type: fs.read
    resource: file://workspace/.env
    decision: DENY

  # CI must never read nested dotenv files.
  - id: ci-strict-deny-nested-env-read
    action_type: fs.read
    resource: file://workspace/**/.env
    decision: DENY

  # CI must never read dotenv variants.
  - id: ci-strict-deny-env-variant-read
    action_type: fs.read
    resource: file://workspace/**/.env.*
    decision: DENY

  # CI must never read private keys.
  - id: ci-strict-deny-private-key-read
    action_type: fs.read
    resource: file://workspace/**/*.key
    decision: DENY

  # CI must never read netrc machine credentials.
  - id: ci-strict-deny-netrc-read
    action_type: fs.read
    resource: file://workspace/**/.netrc
    decision: DENY

  # CI must never read SSH key material.
  - id: ci-strict-deny-ssh-dir-read
    action_type: fs.read
    resource: file://workspace/**/.ssh/**
    decision: DENY

  # CI must never read AWS credential files.
  - id: ci-strict-deny-aws-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.aws/credentials
    decision: DENY

  # CI must never read GCP credential directories.
  - id: ci-strict-deny-gcp-credentials-read
    action_type: fs.read
    resource: file://workspace/**/.gcp/**
    decision: DENY

  # CI must never read kubeconfig files.
  - id: ci-strict-deny-kubeconfig-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig
    decision: DENY

  # CI must never read kubeconfig variants.
  - id: ci-strict-deny-kubeconfig-variant-read
    action_type: fs.read
    resource: file://workspace/**/kubeconfig.*
    decision: DENY

  # CI must never read Kubernetes credential directories.
  - id: ci-strict-deny-kube-dir-read
    action_type: fs.read
    resource: file://workspace/**/.kube/**
    decision: DENY

  # CI may read non-secret workspace content for build and validation.
  - id: ci-strict-allow-workspace-read
    action_type: fs.read
    resource: file://workspace/**
    decision: ALLOW

  # CI may write generated artifacts inside the checked-out workspace.
  - id: ci-strict-allow-workspace-write
    action_type: fs.write
    resource: file://workspace/**
    decision: ALLOW
    obligations:
      sandbox_mode: ci

  # CI may apply generated patches only when workflows explicitly route through this action.
  - id: ci-strict-allow-workspace-patch
    action_type: repo.apply_patch
    resource: repo://local/workspace
    decision: ALLOW
    obligations:
      sandbox_mode: ci

  # CI must not publish repository state through ad hoc git push commands.
  - id: ci-strict-deny-git-push
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["git", "push"]
        - ["git", "push", "**"]

  # CI must not rewrite repository history.
  - id: ci-strict-deny-git-history-rewrite
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["git", "reset", "--hard"]
        - ["git", "rebase"]
        - ["git", "rebase", "**"]
        - ["git", "checkout", "--"]
        - ["git", "checkout", "--", "**"]

  # CI must not perform infrastructure mutations.
  - id: ci-strict-deny-infra-mutations
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["terraform", "apply"]
        - ["terraform", "apply", "**"]
        - ["terraform", "destroy"]
        - ["terraform", "destroy", "**"]
        - ["kubectl", "apply"]
        - ["kubectl", "apply", "**"]
        - ["kubectl", "delete"]
        - ["kubectl", "delete", "**"]
        - ["helm", "upgrade"]
        - ["helm", "upgrade", "**"]
        - ["helm", "uninstall"]
        - ["helm", "uninstall", "**"]

  # CI must not install or mutate dependencies outside reproducible setup stages.
  - id: ci-strict-deny-package-installs
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["go", "get"]
        - ["go", "get", "**"]
        - ["go", "mod", "tidy"]
        - ["npm", "install"]
        - ["npm", "install", "**"]
        - ["npm", "ci"]
        - ["python", "-m", "pip", "install", "**"]
        - ["py", "-3", "-m", "pip", "install", "**"]

  # CI may inspect repository state.
  - id: ci-strict-allow-git-readonly
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["git", "status"]
        - ["git", "status", "**"]
        - ["git", "diff"]
        - ["git", "diff", "**"]
        - ["git", "log"]
        - ["git", "log", "**"]
        - ["git", "show"]
        - ["git", "show", "**"]
        - ["git", "remote"]
        - ["git", "remote", "-v"]
        - ["git", "remote", "--verbose"]
        - ["git", "remote", "show", "**"]
        - ["git", "remote", "get-url", "**"]
        - ["git", "blame", "**"]
        - ["git", "rev-parse", "**"]
        - ["git", "describe", "**"]
        - ["git", "tag"]
        - ["git", "tag", "-l", "**"]
        - ["git", "tag", "--list", "**"]
        - ["git", "stash", "list"]
        - ["git", "shortlog", "**"]
        - ["git", "ls-files"]
        - ["git", "ls-files", "**"]
        - ["git", "reflog"]
        - ["git", "reflog", "show", "**"]
        - ["git", "cat-file", "**"]
        - ["git", "merge-base", "**"]
        - ["git", "worktree", "list"]
        - ["git", "config", "--get", "**"]
        - ["git", "config", "--list"]
        - ["git", "config", "-l"]
        - ["git", "count-objects", "**"]
        - ["git", "check-ignore", "**"]
        - ["git", "branch"]
        - ["git", "branch", "-a"]
        - ["git", "branch", "-r"]
        - ["git", "branch", "-v"]
        - ["git", "branch", "-vv"]
        - ["git", "branch", "-a", "-v"]
        - ["git", "branch", "--show-current"]
        - ["git", "branch", "--list", "**"]
    obligations:
      sandbox_mode: ci

  # CI may run deterministic Go validation.
  - id: ci-strict-allow-go-validation
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["go", "test"]
        - ["go", "test", "**"]
        - ["go", "build"]
        - ["go", "build", "**"]
        - ["go", "vet"]
        - ["go", "vet", "**"]
    obligations:
      sandbox_mode: ci

  # CI may run deterministic npm validation.
  - id: ci-strict-allow-npm-validation
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["npm", "test"]
        - ["npm", "test", "**"]
        - ["npm", "run", "lint"]
        - ["npm", "run", "build"]
        - ["npm", "run", "test"]
    obligations:
      sandbox_mode: ci

  # CI may run deterministic Python tests.
  - id: ci-strict-allow-python-validation
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["python", "-m", "pytest"]
        - ["python", "-m", "pytest", "**"]
        - ["py", "-3", "-m", "pytest"]
        - ["py", "-3", "-m", "pytest", "**"]
    obligations:
      sandbox_mode: ci

  # CI may run safe local inspection commands.
  - id: ci-strict-allow-local-inspection
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["pwd"]
        - ["ls"]
        - ["ls", "**"]
        - ["dir"]
        - ["dir", "**"]
        - ["go", "version"]
        - ["printenv"]
        - ["printenv", "**"]
        - ["env"]
        - ["du", "**"]
        - ["df", "**"]
        - ["uname", "**"]
        - ["id"]
        - ["whoami"]
        - ["date"]
        - ["date", "**"]
        - ["hostname"]
        - ["nproc"]
        - ["arch"]
        - ["basename", "**"]
        - ["dirname", "**"]
        - ["realpath", "**"]
        - ["readlink", "**"]
        - ["type", "**"]
        - ["command", "-v", "**"]
    obligations:
      sandbox_mode: ci

  # CI may publish through the structured Nomos artifact path only.
  - id: ci-strict-allow-structured-publish
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["nomos", "publish-artifact"]
        - ["nomos", "publish-artifact", "**"]
    obligations:
      sandbox_mode: ci
      publish_channel: structured

  # CI must not send authorization material through HTTP.
  - id: ci-strict-deny-http-authorization-header
    action_type: net.http_request
    resource: url://**/**
    decision: DENY
    params_match:
      headers.Authorization:
        present: true

  # CI may make read-only requests to source hosts required by validation.
  - id: ci-strict-allow-http-source-hosts
    action_type: net.http_request
    resource: url://github.com/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # CI may make read-only requests to the Go proxy for module resolution.
  - id: ci-strict-allow-http-go-proxy
    action_type: net.http_request
    resource: url://proxy.golang.org/**
    decision: ALLOW
    params_match:
      method:
        in: ["", "GET", "HEAD"]

  # CI may upload artifacts only to the configured internal artifact endpoint.
  - id: ci-strict-allow-http-artifact-upload
    action_type: net.http_request
    resource: url://artifacts.example.internal/**
    decision: ALLOW
    params_match:
      method:
        in: ["PUT", "POST"]

  # CI cannot check out arbitrary secrets through Nomos by default.
  - id: ci-strict-deny-secret-checkout
    action_type: secrets.checkout
    resource: secret://**/**
    decision: DENY

  # Deny any command whose arguments name secret material (dotenv, keys, cloud and cluster credentials), wherever the token appears.
  - id: ci-strict-deny-exec-secret-file-args
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["**", "*.env", "**"]
        - ["**", "*.env.*", "**"]
        - ["**", "*.envrc", "**"]
        - ["**", "*.pem", "**"]
        - ["**", "*.key", "**"]
        - ["**", "*id_rsa*", "**"]
        - ["**", "*id_ed25519*", "**"]
        - ["**", "*id_ecdsa*", "**"]
        - ["**", "*.ssh/*", "**"]
        - ["**", "*.aws/*", "**"]
        - ["**", "*.gcp/*", "**"]
        - ["**", "*.kube/*", "**"]
        - ["**", "*kubeconfig*", "**"]
        - ["**", "*.netrc", "**"]

  # Deny deletes that target the home directory, the filesystem root, a drive root, or a parent directory, as a whole or through a literal glob (`\*` is a literal star). Other paths outside the workspace are left to the hook's boundary check, which asks.
  - id: ci-strict-deny-catastrophic-delete
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["rm", "**", "~", "**"]
        - ["rm", "**", "~/", "**"]
        - ['rm', '**', '~/\*', '**']
        - ["rm", "**", "/", "**"]
        - ['rm', '**', '/\*', '**']
        - ["rm", "**", "..", "**"]
        - ['rm', '**', '../\*', '**']
        - ["rm", "**", "?:", "**"]
        - ['rm', '**', '?:\', '**']
        - ["rm", "**", "?:/", "**"]
        - ["rm", "**", "/mnt/?", "**"]
        - ["rm", "**", "/mnt/?/", "**"]
        - ["rmdir", "**", "~", "**"]
        - ["rmdir", "**", "~/", "**"]
        - ['rmdir', '**', '~/\*', '**']
        - ["rmdir", "**", "/", "**"]
        - ['rmdir', '**', '/\*', '**']
        - ["rmdir", "**", "..", "**"]
        - ['rmdir', '**', '../\*', '**']
        - ["rmdir", "**", "?:", "**"]
        - ['rmdir', '**', '?:\', '**']
        - ["rmdir", "**", "?:/", "**"]
        - ["rmdir", "**", "/mnt/?", "**"]
        - ["rmdir", "**", "/mnt/?/", "**"]

  # Deny destructive git operations however their arguments are spelled.
  - id: ci-strict-deny-git-destructive-with-args
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        - ["git", "reset", "--hard", "**"]
        - ["git", "clean", "**"]
        - ["git", "branch", "-D", "**"]
        - ["git", "push", "--force", "**"]
        - ["git", "push", "-f", "**"]
        - ["git", "push", "--force-with-lease", "**"]
        - ["git", "push", "--force*", "**"]
        - ["git", "push", "**", "--force*", "**"]
        - ["git", "push", "**", "-f", "**"]
        - ["git", "commit", "--amend"]
        - ["git", "commit", "--amend", "**"]
        - ["git", "commit", "**", "--amend", "**"]
        - ["git", "restore", "**"]
        - ["git", "checkout", "."]
        - ["git", "checkout", "**", "--", "**"]

  # Conservative workspace file operations for CI runs; paths outside the workspace are asked about by the hook.
  # sed is not allowed here: a sed script can read and write arbitrary files (r, w) and run commands (e),
  # and the policy cannot see inside it.
  - id: ci-strict-allow-workspace-file-ops
    action_type: process.exec
    resource: file://workspace/
    decision: ALLOW
    exec_match:
      argv_patterns:
        - ["mkdir", "**"]
        - ["touch", "**"]
        - ["cp", "**"]
        - ["mv", "**"]
        - ["tar", "**"]
        - ["unzip", "**"]
        - ["sha256sum", "**"]
        - ["shasum", "**"]
        - ["md5sum", "**"]
        - ["jq", "**"]
        - ["true"]
        - ["false"]
        - ["test", "**"]
        - ["[", "**"]
    obligations:
      sandbox_mode: local

  # Inline interpreter code (python -c, node -e, ruby -e, ...) and interactive interpreters or shells run
  # code the policy cannot see: they are denied. Scripts started by name are decided by the toolchain rules
  # above. Common clusters (-uc, -pe) are listed; glued forms (-c'code'), rarer clusters, and program
  # text (a sed script, an awk program without system/getline/|) are a documented limit.
  - id: ci-strict-deny-inline-interpreter-code
    action_type: process.exec
    resource: file://workspace/
    decision: DENY
    exec_match:
      argv_patterns:
        # Inline code passed on the command line.
        - ["python*", "-c", "**"]
        - ["python*", "-*", "-c", "**"]
        - ["python*", "-*", "-*", "-c", "**"]
        - ["python*", "-W", "*", "-c", "**"]
        - ["python*", "-X", "*", "-c", "**"]
        - ["py", "-c", "**"]
        - ["py", "-*", "-c", "**"]
        - ["uv", "run", "python*", "-c", "**"]
        - ["uv", "run", "python*", "-*", "-c", "**"]
        - ["poetry", "run", "python*", "-c", "**"]
        - ["pipenv", "run", "python*", "-c", "**"]
        - ["node", "-e", "**"]
        - ["node", "--eval", "**"]
        - ["node", "--eval=*", "**"]
        - ["node", "-p", "**"]
        - ["node", "--print", "**"]
        - ["node", "--print=*", "**"]
        - ["node", "-*", "-e", "**"]
        - ["node", "-*", "--eval", "**"]
        - ["node", "-*", "--eval=*", "**"]
        - ["node", "-*", "-p", "**"]
        - ["node", "-*", "--print", "**"]
        - ["node", "-*", "--print=*", "**"]
        - ["bun", "-e", "**"]
        - ["bun", "--eval", "**"]
        - ["bun", "-p", "**"]
        - ["bun", "--print", "**"]
        - ["deno", "eval", "**"]
        - ["ruby", "-e", "**"]
        - ["ruby", "-*", "-e", "**"]
        - ["perl", "**", "-e", "**"]
        - ["perl", "**", "-E", "**"]
        - ["perl", "**", "-?e", "**"]
        - ["perl", "**", "-??e", "**"]
        - ["perl", "**", "-?E", "**"]
        - ["php", "-r", "**"]
        - ["php", "-*", "-r", "**"]
        # Interactive interpreters and shells, and programs read from stdin.
        - ["python*"]
        - ["python*", "-"]
        - ["python*", "-i", "**"]
        - ["py"]
        - ["node"]
        - ["node", "-"]
        - ["node", "-i"]
        - ["node", "--interactive"]
        - ["bun", "repl"]
        - ["deno"]
        - ["deno", "repl"]
        - ["ruby"]
        - ["ruby", "-"]
        - ["irb", "**"]
        - ["perl"]
        - ["perl", "-"]
        - ["php", "-a"]
        - ["bash"]
        - ["bash", "-"]
        - ["sh"]
        - ["sh", "-"]
        - ["zsh"]
        - ["dash"]
        - ["fish"]
        - ["ksh"]
        # Clusters, two-token options, and REPL modules the plain forms above miss.
        - ["python*", "-?c", "**"]
        - ["python*", "-??c", "**"]
        - ["python*", "-m", "code", "**"]
        - ["python*", "-m", "pdb", "**"]
        - ["python*", "-m", "timeit", "**"]
        - ["python*", "-m", "asyncio", "**"]
        - ["python*", "-*", "-m", "code", "**"]
        - ["python*", "-*", "-m", "pdb", "**"]
        - ["python*", "-*", "-m", "timeit", "**"]
        - ["python*", "-*", "-m", "asyncio", "**"]
        - ["node", "-pe", "**"]
        - ["node", "-ep", "**"]
        - ["node", "-*", "*", "-e", "**"]
        - ["node", "-*", "*", "--eval", "**"]
        - ["node", "-*", "*", "--eval=*", "**"]
        - ["node", "-*", "*", "-p", "**"]
        - ["node", "-*", "*", "--print", "**"]
        - ["node", "-*", "*", "--print=*", "**"]
        - ["ruby", "-?e", "**"]
        - ["ruby", "-??e", "**"]
        - ["ruby", "-*", "-?e", "**"]
        - ["php", "-*", "*", "-r", "**"]
        - ["deno", "run", "**", "-"]
        # Programs whose own scripts or options run commands.
        - ["*awk", "**", "*system(*", "**"]
        - ["*awk", "**", "*getline*", "**"]
        - ["*awk", "**", "*|*", "**"]
        - ["*awk", "**", "-f", "**"]
        - ["*awk", "**", "-f*", "**"]
        - ["*awk", "**", "--file*", "**"]
        - ["tar", "**", "--to-command*", "**"]
        - ["tar", "**", "--use-compress-program*", "**"]
        - ["tar", "**", "-I", "**"]
        - ["tar", "**", "--rsh-command*", "**"]
        - ["tar", "**", "--rmt-command*", "**"]
        - ["zip", "**", "-TT", "**"]
        - ["zip", "**", "--unzip-command*", "**"]

  # CI must never write secret material.
  - id: ci-strict-deny-secret-file-write
    action_type: fs.write
    resource: file://workspace/**/.env
    decision: DENY
  - id: ci-strict-deny-secret-file-variant-write
    action_type: fs.write
    resource: file://workspace/**/.env.*
    decision: DENY
  - id: ci-strict-deny-root-secret-file-write
    action_type: fs.write
    resource: file://workspace/.env
    decision: DENY
  - id: ci-strict-deny-key-file-write
    action_type: fs.write
    resource: file://workspace/**/*.key
    decision: DENY
  - id: ci-strict-deny-pem-file-write
    action_type: fs.write
    resource: file://workspace/**/*.pem
    decision: DENY
