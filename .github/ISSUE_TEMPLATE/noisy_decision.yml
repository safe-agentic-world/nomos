name: Noisy decision report
description: A benign, in-workspace command that a default profile denies or asks about.
labels: ["noisy-decision"]
body:
  - type: markdown
    attributes:
      value: |
        These reports tune the default profiles. The incident cases stay denied; the goal is fewer prompts on ordinary work.
  - type: input
    id: version
    attributes:
      label: Nomos version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and profile
      description: The exact command and the profile (`safe-dev`, `ci-strict`, `prod-locked`) or your bundle.
      render: shell
    validations:
      required: true
  - type: textarea
    id: simulate
    attributes:
      label: Hook output
      description: Paste the output of `nomos hook claude-code --simulate --profile <profile> --command '<command>'`.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why it is routine
      description: What the command does in your project and how often an agent runs it. Mention if it can execute project code (test runners, package scripts, interpreters).
    validations:
      required: true
